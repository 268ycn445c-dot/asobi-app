<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="だんごむし">
<meta name="theme-color" content="#8a6a48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>だんごむし さがし</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8a6a48;}
  body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;color:#4a2c12}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
  .hidden{display:none !important}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

  #start{background:rgba(110,80,50,.55);cursor:pointer}
  #start h1{margin:0 0 2vmin;font-size:clamp(40px,11vmin,110px);color:#fff;letter-spacing:.06em;
    text-shadow:0 4px 0 #4a3420,0 0 18px rgba(0,0,0,.2);text-align:center;line-height:1.15}
  #start img{width:clamp(120px,30vmin,260px);animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
  #start .tap{margin-top:3vmin;font-size:clamp(28px,8vmin,72px);animation:tap 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6%) rotate(8deg)}}
  @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-20%)}}

  #zukan{background:#fff6e4;justify-content:flex-start;overflow:auto;touch-action:pan-y;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px);box-sizing:border-box}
  .zhead{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ztitle{font-size:clamp(28px,6vmin,52px);font-weight:bold}
  .bigx{width:clamp(64px,13vmin,96px);height:clamp(64px,13vmin,96px);border-radius:50%;border:none;background:#e8604c;color:#fff;
    font-size:clamp(32px,7vmin,52px);box-shadow:0 5px 0 #b13e2d;flex:none}
  .bigx:active{transform:translateY(4px);box-shadow:0 1px 0 #b13e2d}
  .zsub{width:100%;max-width:980px;margin-top:18px;font-size:clamp(22px,4.5vmin,34px);font-weight:bold;color:#9a7448}
  .zgrid{width:100%;max-width:980px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-top:8px}
  .card{background:#fff;border:4px solid #e9cf9c;border-radius:22px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .card img{height:clamp(80px,14vmin,120px)}
  .card.no img{filter:brightness(0);opacity:.16}
  .card .nm{font-size:clamp(20px,3.6vmin,30px);font-weight:bold;white-space:nowrap}
  .card .nm.long{font-size:clamp(13px,2.1vmin,18px)}
  .card .ct{font-size:clamp(16px,3.2vmin,22px);color:#9a7448}
  .card.wig{animation:wig .5s}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
  .ztotal{width:100%;max-width:980px;margin-top:20px;font-size:clamp(20px,4vmin,30px);text-align:center;font-weight:bold}

  #settings{background:rgba(40,30,20,.55)}
  .sbox{background:#fff;border-radius:22px;padding:20px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;box-sizing:border-box;touch-action:pan-y}
  .sbox h2{margin:0 0 12px;font-size:24px}
  .row{margin:14px 0}
  .row .lb{font-size:17px;font-weight:bold;margin-bottom:6px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:12px 4px;font-size:17px;border-radius:12px;border:2px solid #d9c19a;background:#fffaf0}
  .seg button.on{background:#f0a830;border-color:#c98410;color:#fff;font-weight:bold}
  .sbtns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .sbtns button,.sbtns a{padding:14px;font-size:17px;border-radius:12px;border:none;background:#eee;text-align:center;text-decoration:none;color:#333}
  .sbtns .close{background:#5aa845;color:#fff;font-weight:bold}
  .sbtns .danger{background:#fbe3df;color:#b13e2d}
  .note{font-size:13px;color:#777;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="cv"></canvas>

<div id="start" class="ov">
  <h1>だんごむし<br>さがし</h1>
  <img id="startImg" alt="">
  <div class="tap">👆</div>
</div>

<div id="zukan" class="ov hidden">
  <div class="zhead"><div class="ztitle">📖 ずかん</div><button class="bigx" id="zclose" aria-label="とじる">✕</button></div>
  <div class="zsub">だんごむし</div>
  <div id="zgrid" class="zgrid"></div>
  <div class="zsub">ほかの いきもの</div>
  <div id="zgrid2" class="zgrid"></div>
  <div class="ztotal" id="ztotal"></div>
</div>

<div id="settings" class="ov hidden">
  <div class="sbox">
    <h2>せってい（おとなよう）</h2>
    <div class="row"><div class="lb">こえ</div><div class="seg" data-key="voice"><button data-v="true">あり</button><button data-v="false">なし</button></div></div>
    <div class="row"><div class="lb">こうかおん</div><div class="seg" data-key="sfx"><button data-v="true">あり</button><button data-v="false">なし</button></div></div>
    <div class="row"><div class="lb">1かいで みつける かず</div><div class="seg" data-key="target"><button data-v="3">3</button><button data-v="5">5</button><button data-v="8">8</button></div></div>
    <div class="row"><div class="lb">にげる だんごむし（ながおしで つかまえる）</div><div class="seg" data-key="runaway"><button data-v="0">なし</button><button data-v="0.25">すこし</button><button data-v="0.45">ふつう</button></div></div>
    <div class="row"><div class="lb">ながおしの ながさ</div><div class="seg" data-key="hold"><button data-v="0.4">みじかい</button><button data-v="0.7">ふつう</button><button data-v="1.1">ながい</button></div></div>
    <div class="sbtns">
      <button class="close" id="sclose">とじる</button>
      <a href="../">ほかの あそびへ</a>
      <button class="danger" id="sreset">きろくを ぜんぶ けす</button>
    </div>
    <div class="note">iPhone・iPad で音が出ないときは、本体の消音スイッチ（マナーモード）を確認してください。<br>この画面は右下の ⚙ を長押しすると開きます。</div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 保存 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const SAVE_KEY = 'dango-save-v1', SET_KEY = 'dango-settings-v1';
const save = Object.assign({ counts: {}, critters: {}, total: 0, stage: 0 }, store.get(SAVE_KEY, {}));
const settings = Object.assign({ voice: true, sfx: true, target: 5, runaway: 0.45, hold: 0.7 }, store.get(SET_KEY, {}));
const persist = () => store.set(SAVE_KEY, save);

/* ---------- いきもの ---------- */
const BUGS = [
  { id: 'oka', name: 'オカダンゴムシ', kana: 'おかだんごむし', say: 'だんごむし！', weight: 50, col: '#5d626b', col2: '#373a40', size: 1 },
  { id: 'mesu', name: 'オカダンゴムシ（メス）', kana: 'だんごむし（めす）', say: 'だんごむし！', weight: 24, col: '#6b6458', col2: '#433e36', spots: '#e8c860', size: 1 },
  { id: 'hanadaka', name: 'ハナダカダンゴムシ', kana: 'はなだかだんごむし', say: 'はなだか だんごむし！', weight: 12, col: '#7a5a3e', col2: '#4b3524', spots: '#e8b860', size: 1.05 },
  { id: 'koshibiro', name: 'コシビロダンゴムシ', kana: 'こしびろだんごむし', say: 'こしびろ だんごむし！', weight: 8, col: '#8d6c4a', col2: '#5a4430', size: 0.78 },
  { id: 'kiiro', name: 'きいろい ダンゴムシ', kana: 'きいろい だんごむし', say: 'きいろい だんごむし！', weight: 4, col: '#e9c13e', col2: '#b38b22', size: 1, rare: true },
  { id: 'shiro', name: 'しろい ダンゴムシ', kana: 'しろい だんごむし', say: 'しろい だんごむし！', weight: 2, col: '#efede6', col2: '#b9b5aa', size: 1, rare: true },
];
const CRITTERS = [
  { id: 'mimizu', name: 'ミミズ', kana: 'みみず', say: 'みみず！', weight: 30 },
  { id: 'ari', name: 'アリ', kana: 'あり', say: 'ありさん！', weight: 30 },
  { id: 'waraji', name: 'ワラジムシ', kana: 'わらじむし', say: 'わらじむし！ まるく ならないね', weight: 25 },
  { id: 'katatsumuri', name: 'カタツムリ', kana: 'かたつむり', say: 'かたつむり！', weight: 15 },
];
const pickW = list => { let r = Math.random() * list.reduce((a, s) => a + s.weight, 0); for (const s of list) if ((r -= s.weight) < 0) return s; return list[0]; };

/* ---------- 場所（ステージ） ---------- */
const STAGES = [
  { name: 'くさむら', say: 'くさむらで さがそう！', ground: ['#8a6a48', '#7d5f40'], covers: { grass: 1 } },
  { name: 'いしの した', say: 'いしの したを みてみよう！', ground: ['#9a8064', '#8a7056'], covers: { stone: 0.8, grass: 0.2 } },
  { name: 'おちば', say: 'おちばの したに いるかな？', ground: ['#8c6a46', '#7a5a3a'], covers: { leaf: 1 } },
  { name: 'にわ', say: 'おにわで さがそう！', ground: ['#7f6448', '#705840'], covers: { log: 0.25, stone: 0.3, leaf: 0.25, grass: 0.2 } },
];

/* ---------- おと ---------- */
let AC = null;
function audioInit() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol = 0.25, delay = 0) {
  if (!settings.sfx || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol = 0.2, q = 0.8) {
  if (!settings.sfx || !AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
const SFX = {
  grass() { noise(0.35, 3000, 0.4); },
  stone() { noise(0.25, 400, 0.6, 1.5); tone('triangle', 140, 90, 0.2, 0.2); },
  leaf() { noise(0.4, 1800, 0.35, 0.5); },
  log() { noise(0.35, 300, 0.6, 1.2); tone('triangle', 110, 80, 0.3, 0.2); },
  poke() { noise(0.1, 900, 0.25, 2); },
  found() { [784, 988, 1175].forEach((f, i) => tone('sine', f, f, 0.12, 0.18, i * 0.07)); },
  curl() { tone('sine', 700, 300, 0.18, 0.28); },
  plop() { tone('triangle', 420, 200, 0.15, 0.28); },
  boing() { tone('sine', 220, 520, 0.22, 0.25); },
  holdTick(f) { tone('sine', 400 + f * 600, 420 + f * 600, 0.05, 0.08); },
  sparkle() { [1568, 2093, 2637].forEach((f, i) => tone('sine', f, f * 1.01, 0.18, 0.12, i * 0.07)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('triangle', f, f, i === 5 ? 0.5 : 0.16, 0.25, i * 0.13)); },
};

/* ---------- こえ ---------- */
let jaVoice = null;
function findVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    jaVoice = vs.find(v => /Kyoko|O-ren|Nanami|Google/i.test(v.name)) || vs[0] || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
function speak(text, rate = 0.85) {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = rate; u.pitch = 1.15;
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 絵：だんごむし（上から見たところ） ----------
   ang = 頭の向き、roll = 0 のびている → 1 まるまっている */
function drawDango(c, sp, x, y, L, ang, roll = 0, leg = 0, twitch = 0) {
  L *= sp.size;
  c.save(); c.translate(x, y); c.rotate(ang);
  const d = L * 0.66;
  const rx = (L / 2) * (1 - roll) + (d / 2) * roll, ry = (L * 0.31) * (1 - roll) + (d / 2) * roll;
  // あし
  if (roll < 0.7) {
    c.save(); c.globalAlpha *= 1 - roll / 0.7;
    c.strokeStyle = sp.col2; c.lineWidth = Math.max(1, L * 0.035); c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const px = -rx * 0.65 + i * (rx * 1.3 / 6), sw = Math.sin(leg + i * 0.9) * L * 0.045;
      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(px, s * ry * 0.75); c.lineTo(px + sw, s * (ry + L * 0.08)); c.stroke(); }
    }
    c.restore();
  }
  // しょっかく
  if (roll < 0.5) {
    c.save(); c.globalAlpha *= 1 - roll / 0.5;
    c.strokeStyle = sp.col2; c.lineWidth = Math.max(1, L * 0.03); c.lineCap = 'round';
    for (const s of [-1, 1]) {
      const tw = Math.sin(twitch * 9 + s) * L * 0.03;
      c.beginPath(); c.moveTo(rx * 0.85, s * ry * 0.3);
      c.quadraticCurveTo(rx + L * 0.12, s * ry * 0.45, rx + L * 0.2 + tw, s * (ry * 0.85 + tw)); c.stroke();
    }
    c.restore();
  }
  // からだ
  const g = c.createRadialGradient(-rx * 0.3, -ry * 0.4, ry * 0.1, 0, 0, Math.max(rx, ry) * 1.1);
  g.addColorStop(0, sp.col); g.addColorStop(1, sp.col2);
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = Math.max(1, L * 0.025); c.stroke();
  // ふし
  c.save(); c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.clip();
  c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = Math.max(1, L * 0.022);
  for (let i = 1; i < 8; i++) {
    const px = -rx + i * (2 * rx / 8);
    c.beginPath(); c.moveTo(px - rx * 0.05, -ry); c.quadraticCurveTo(px + rx * 0.12, 0, px - rx * 0.05, ry); c.stroke();
  }
  if (sp.spots) {
    c.fillStyle = sp.spots;
    for (let i = 1; i < 7; i++) { const px = -rx + (i + 0.5) * (2 * rx / 8); for (const s of [-1, 1]) { c.beginPath(); c.arc(px, s * ry * 0.45, L * 0.03, 0, Math.PI * 2); c.fill(); } }
  }
  c.restore();
  // あたま・め
  if (roll < 0.8) {
    c.save(); c.globalAlpha *= 1 - roll / 0.8;
    c.fillStyle = sp.col2; c.beginPath(); c.ellipse(rx * 0.86, 0, rx * 0.16, ry * 0.62, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff';
    for (const s of [-1, 1]) { c.beginPath(); c.arc(rx * 0.9, s * ry * 0.32, L * 0.04, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#111';
    for (const s of [-1, 1]) { c.beginPath(); c.arc(rx * 0.92, s * ry * 0.32, L * 0.022, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }
  // つや
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-rx * 0.15, -ry * 0.45, rx * 0.5, ry * 0.18, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawWaraji(c, x, y, L, ang, leg = 0, twitch = 0) {
  c.save(); c.translate(x, y); c.rotate(ang);
  const rx = L / 2, ry = L * 0.27;
  c.strokeStyle = '#4a4238'; c.lineCap = 'round'; c.lineWidth = Math.max(1, L * 0.035);
  for (let i = 0; i < 7; i++) {
    const px = -rx * 0.65 + i * (rx * 1.3 / 6), sw = Math.sin(leg + i * 0.9) * L * 0.05;
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(px, s * ry * 0.75); c.lineTo(px + sw, s * (ry + L * 0.1)); c.stroke(); }
  }
  for (const s of [-1, 1]) { // ながい しょっかく と おしりの とげ
    const tw = Math.sin(twitch * 9 + s) * L * 0.04;
    c.beginPath(); c.moveTo(rx * 0.85, s * ry * 0.3); c.quadraticCurveTo(rx + L * 0.2, s * ry * 0.6, rx + L * 0.36 + tw, s * (ry * 1.3 + tw)); c.stroke();
    c.beginPath(); c.moveTo(-rx * 0.9, s * ry * 0.35); c.lineTo(-rx - L * 0.14, s * ry * 0.6); c.stroke();
  }
  c.fillStyle = '#857b6d'; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = Math.max(1, L * 0.022);
  c.save(); c.clip();
  for (let i = 1; i < 8; i++) { const px = -rx + i * (2 * rx / 8); c.beginPath(); c.moveTo(px, -ry); c.quadraticCurveTo(px + rx * 0.1, 0, px, ry); c.stroke(); }
  c.fillStyle = 'rgba(230,220,200,.5)';
  for (let i = 1; i < 7; i++) { const px = -rx + (i + 0.5) * (2 * rx / 8); c.beginPath(); c.arc(px, 0, L * 0.025, 0, Math.PI * 2); c.fill(); }
  c.restore();
  c.fillStyle = '#5a5248'; c.beginPath(); c.ellipse(rx * 0.86, 0, rx * 0.15, ry * 0.6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff'; for (const s of [-1, 1]) { c.beginPath(); c.arc(rx * 0.9, s * ry * 0.32, L * 0.035, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = '#111'; for (const s of [-1, 1]) { c.beginPath(); c.arc(rx * 0.92, s * ry * 0.32, L * 0.02, 0, Math.PI * 2); c.fill(); }
  c.restore();
}
function drawMimizu(c, x, y, L, ang, t, shrink = 0) {
  c.save(); c.translate(x, y); c.rotate(ang);
  const n = 14, len = L * 1.2 * (1 - shrink), pts = [];
  for (let i = 0; i <= n; i++) { const u = i / n; pts.push([(u - 0.5) * len, Math.sin(t * 5 + u * 6) * L * 0.08]); }
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = '#c96f6f'; c.lineWidth = L * 0.13;
  c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke();
  c.strokeStyle = '#e99a95'; c.lineWidth = L * 0.09; c.stroke();
  const [bx, by] = pts[Math.round(n * 0.7)]; // 帯
  c.fillStyle = '#d9827c'; c.beginPath(); c.ellipse(bx, by, L * 0.06, L * 0.07, 0, 0, Math.PI * 2); c.fill();
  const [hx, hy] = pts[n]; c.fillStyle = '#111';
  c.beginPath(); c.arc(hx - L * 0.02, hy - L * 0.02, L * 0.015, 0, Math.PI * 2); c.arc(hx - L * 0.02, hy + L * 0.02, L * 0.015, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ---------- 絵：かくれば ---------- */
function blobPath(c, r, seed, n = 9) { // まるみのある石の形
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, k = 0.8 + 0.2 * Math.sin(seed * 7.1 + i * 2.3);
    pts.push([Math.cos(a) * r * k, Math.sin(a) * r * k * 0.78]);
  }
  const mid = i => { const p = pts[i % n], q = pts[(i + 1) % n]; return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; };
  c.beginPath(); const m0 = mid(n - 1); c.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(i); c.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  c.closePath();
}
function drawGrass(c, cv_, p, wob) { // p = かきわけ具合 0..1
  const r = cv_.r, n = cv_.blades.length;
  for (let i = 0; i < n; i++) {
    const b = cv_.blades[i];
    let a = b.a;
    const side = Math.cos(a) >= 0 ? 1 : -1;
    a += -side * Math.sin(a) * 0 + p * side * 0; // (向きはそのまま)
    const push = p * r * 0.55 * side;
    const bx = b.bx + push, by = b.by;
    const len = r * b.len * (1 - p * 0.25), sway = Math.sin(state.time * 2 + i) * 0.04 + wob * Math.sin(state.time * 30 + i) * 0.12;
    const ta = a + sway + p * side * 0.5 * (Math.sin(a) > 0 ? 1 : -1) * 0;
    const tx = bx + Math.cos(ta) * len + push * 0.6, ty = by + Math.sin(ta) * len * 0.8;
    const nx = -Math.sin(ta) * r * 0.07, ny = Math.cos(ta) * r * 0.07;
    c.fillStyle = b.col;
    c.beginPath(); c.moveTo(bx - nx, by - ny);
    c.quadraticCurveTo((bx + tx) / 2 - nx * 1.6, (by + ty) / 2 - ny * 1.6, tx, ty);
    c.quadraticCurveTo((bx + tx) / 2 + nx * 1.6, (by + ty) / 2 + ny * 1.6, bx + nx, by + ny);
    c.fill();
  }
}
function drawStone(c, cv_, wob) {
  const r = cv_.r;

  c.fillStyle = 'rgba(0,0,0,.22)'; c.save(); c.translate(r * 0.06, r * 0.1); blobPath(c, r, cv_.seed); c.fill(); c.restore();

  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.3, r * 0.3, r * 0.14, -0.4, 0, Math.PI * 2); c.fill();
  c.restore();
}
function leafPath(c, r) {

}

  c.fillStyle = 'rgba(0,0,0,.18)'; c.save(); c.translate(r * 0.05, r * 0.08); leafPath(c, r); c.fill(); c.restore();
  c.fillStyle = cv_.col[0]; leafPath(c, r); c.fill();

  c.beginPath(); c.moveTo(-r * 1.15, 0); c.lineTo(r * 0.9, 0);

  c.stroke();

}
function drawLog(c, cv_, wob) {
  const r = cv_.r, w = r * 1.9, h = r * 0.8;
  c.save(); c.rotate(cv_.rot + Math.sin(state.time * 30) * wob * 0.04);

/* ---------- じょうたい ---------- */
let W = 0, H = 0, DPR = 1, M = 0, S = 120, BL = 50;
const safe = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
const state = {
  started: false, paused: false, time: 0,
  covers: [], bugs: [], critters: [], flying: [], parts: [],
  got: 0, target: settings.target, slotPop: [], banner: null, clear: null, fade: 0, fadeDir: 0,
  stick: { x: 0, y: 0, tx: 0, ty: 0, poke: 0 },
  pointers: new Map(), idle: 0, hintT: 0, stageIntro: null,

let groundCanvas = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; M = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle($('#safe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  L.pad = 14;
  L.btn = Math.max(66, Math.min(M * 0.15, 110));
  L.zukan = { x: safe.l + L.pad + L.btn / 2, y: safe.t + L.pad + L.btn / 2, r: L.btn / 2 };
  L.gear = { x: W - safe.r - 30, y: H - safe.b - 30, r: 22 };
  L.top = safe.t + L.btn + L.pad * 2;
  L.area = { x0: safe.l + L.pad, x1: W - safe.r - L.pad, y0: L.top, y1: H - safe.b - L.pad };
  S = clamp(M * 0.26, 100, 230);
  BL = Math.max(44, S * 0.4);
  layoutSlots();
  makeGround();
  if (state.started && !state.stick.tx) restStick();
}
function layoutSlots() {
  const T = state.target, x0 = L.zukan.x + L.zukan.r + L.pad, x1 = W - safe.r - L.pad;
  const r = clamp((x1 - x0) / (T * 2.3), 16, 36), cy = L.zukan.y, gap = r * 2.3;
  const sx = (x0 + x1) / 2 - gap * (T - 1) / 2;

}
function restStick() { state.stick.tx = W * 0.82; state.stick.ty = H * 0.86; if (!state.stick.x) { state.stick.x = state.stick.tx; state.stick.y = state.stick.ty; } }
function makeGround() {
  const st = STAGES[save.stage % STAGES.length];
  groundCanvas = document.createElement('canvas');
  groundCanvas.width = Math.round(W * DPR); groundCanvas.height = Math.round(H * DPR);
  const g = groundCanvas.getContext('2d'); g.scale(DPR, DPR);
  g.fillStyle = st.ground[0]; g.fillRect(0, 0, W, H);
  let seed = save.stage * 97 + 13; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < W * H / 900; i++) { // つちの つぶ
    g.fillStyle = r() < 0.5 ? st.ground[1] : 'rgba(255,240,210,.08)';
    g.beginPath(); g.arc(r() * W, r() * H, 1 + r() * 3, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < W * H / 9000; i++) { // こいし
    g.fillStyle = ['#b9a68c', '#a39079', '#8c7a64'][Math.floor(r() * 3)];
    g.beginPath(); g.ellipse(r() * W, r() * H, 3 + r() * 6, 2 + r() * 4, r() * 3, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < W * H / 14000; i++) { // めばえ
    const x = r() * W, y = r() * H, s = 6 + r() * 8;
    g.strokeStyle = '#6a9a42'; g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - s * 0.4, y - s); g.moveTo(x, y); g.lineTo(x + s * 0.3, y - s * 0.9); g.stroke();
  }
  const v = g.createRadialGradient(W / 2, H / 2, M * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75); // ふちを少し暗く
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.25)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

/* ---------- ステージをつくる（ランダムに散らばる） ---------- */
function newStage() {
  const st = STAGES[save.stage % STAGES.length];
  state.target = settings.target; layoutSlots();
  state.covers = []; state.bugs = []; state.critters = []; state.flying = []; state.parts = [];
  state.got = 0; state.slotPop = []; state.clear = null; state.banner = null; state.idle = 0; restStick();
  makeGround();
  const A = L.area;
  for (let tries = 0; tries < 900 && state.covers.length < 14; tries++) {
    const type = pickW(Object.entries(st.covers).map(([k, w]) => ({ k, weight: w }))).k;
    const r = S / 2 * rnd(0.8, 1.15) * (type === 'log' ? 0.85 : type === 'leaf' ? 1.05 : 1);
    const ext = type === 'log' ? r * 1.0 : r;
    const x = rnd(A.x0 + ext, A.x1 - ext), y = rnd(A.y0 + r * 0.8, A.y1 - r * 0.8);
    if (state.covers.some(o => Math.hypot(o.x - x, o.y - y) < (o.r + r) * (0.95 + Math.random() * 0.3))) continue;
    state.covers.push(makeCover(type, x, y, r));
  }
  // 中身をきめる：だんごむしは目標+2ひき
  const cs = state.covers.slice().sort(() => Math.random() - 0.5);
  let need = state.target + 2, i = 0;
  while (need > 0 && cs.length) {
    const c = cs[i % cs.length], k = Math.min(need, c.bugs.length === 0 && Math.random() < 0.25 ? 2 : 1);
    for (let j = 0; j < k; j++) c.bugs.push(pickW(BUGS));
    need -= k; i++;
  }
  for (const c of cs) if (!c.bugs.length && Math.random() < 0.5) c.critter = pickW(CRITTERS);
  state.stageIntro = { t: 0, name: st.name };
  speak(st.say, 0.9);
}
function makeCover(type, x, y, r) {
  const c = { type, x, y, r, rot: rnd(-0.6, 0.6), seed: Math.random() * 100, lifted: false, t: 0, wob: 0, bugs: [], critter: null, dir: Math.random() < 0.5 ? -1 : 1 };
  if (type === 'grass') {
    c.blades = [];
    const n = 16 + Math.floor(Math.random() * 6), cols = ['#5a9a3a', '#6fb04a', '#4c8a30', '#7cbd52'];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rnd(-1.6, 1.6) + (i % 2 ? Math.PI : 0);
      c.blades.push({ a, len: rnd(0.65, 1.05), bx: rnd(-r * 0.25, r * 0.25), by: rnd(-r * 0.15, r * 0.15), col: cols[i % 4] });
    }
    c.blades.sort((a, b) => a.by - b.by);
  }
  if (type === 'stone') { const k = Math.random(); c.col = k < 0.5 ? ['#b8b2a8', '#7d776e'] : ['#a9a196', '#6e675d']; }
  if (type === 'leaf') c.col = [['#d9a336', '#a8741c'], ['#c9612e', '#93401a'], ['#8a9a3a', '#5e6c20'], ['#a8743a', '#6e4820']][Math.floor(Math.random() * 4)];
  return c;
}

/* ---------- タップ ---------- */
function hitBug(px, py) {
  let best = null, bd = 1e9;
  for (const b of state.bugs) {
    if (b.state !== 'walk' && b.state !== 'still') continue;
    const d = Math.hypot(px - b.x, py - b.y), r = Math.max(BL * b.sp.size * 0.75, 46);
    if (d < r && d / r < bd) { best = b; bd = d / r; }
  }
  return best;
}
function onDown(e) {
  audioInit();
  state.idle = 0;
  const px = e.clientX, py = e.clientY;
  if (!state.started || state.paused || state.fadeDir) return;
  if (state.clear) { if (state.clear.t > 1.8) nextStage(); return; }
  if (Math.hypot(px - L.zukan.x, py - L.zukan.y) < L.zukan.r + 8) { openZukan(); return; }
  // スロットをタップ → かずを読む
  if (L.slots.some(s => Math.hypot(px - s.x, py - s.y) < s.r * 1.3)) { SFX.plop(); speak(`${state.got}ひき`); return; }
  moveStick(px, py);
  const b = hitBug(px, py);
  if (b) {
    if (b.state === 'still') { collect(b); return; }
    // にげている → ながおしで つかまえる
    b.held = { id: e.pointerId, t: 0, x: px, y: py };
    state.pointers.set(e.pointerId, { bug: b });
    return;
  }
  for (const c of state.critters) {
    if (c.gone) continue;
    if (Math.hypot(px - c.x, py - c.y) < Math.max(BL * 0.8, 50)) { tapCritter(c); return; }
  }
  // いちばん上にある かくれば
  for (let i = state.covers.length - 1; i >= 0; i--) {
    const c = state.covers[i];
    if (c.lifted) continue;
    const ext = c.type === 'log' ? c.r * 1.1 : c.r;
    if (Math.hypot((px - c.x) / ext, (py - c.y) / c.r) < 1.05) { lift(c); return; }
  }
  // なにもない地面
  SFX.poke(); burst(px, py, 'dirt', 6);
}
function onMove(e) {
  const p = state.pointers.get(e.pointerId);
  if (p && p.bug && p.bug.held) {
    const b = p.bug;
    b.held.x = e.clientX; b.held.y = e.clientY;
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) > Math.max(BL * 1.3, 70)) releaseHold(e.pointerId, false);
    else moveStick(e.clientX, e.clientY);
  }
}
function releaseHold(id, wasUp) {
  const p = state.pointers.get(id); state.pointers.delete(id);
  if (!p || !p.bug || !p.bug.held) return;
  const b = p.bug; b.held = null;
  if (b.state === 'walk') { b.stopT = 1.2; b.twitch = 1; if (wasUp) SFX.boing(); } // みじかいタップ → ちょっと止まる
}
function moveStick(x, y) { state.stick.tx = x; state.stick.ty = y; state.stick.poke = 1; }

function lift(c) {
  c.lifted = true; c.t = 0;
  SFX[c.type]();
  burst(c.x, c.y, c.type === 'grass' ? 'blade' : c.type === 'leaf' ? 'leafbit' : 'dirt', 8);
  // 中身をだす
  setTimeout(() => {
    if (!state.covers.includes(c)) return;
    let any = false;
    c.bugs.forEach((sp, i) => {
      const a = Math.random() * Math.PI * 2, d = c.bugs.length > 1 ? c.r * 0.3 : rnd(0, c.r * 0.15);
      const walk = Math.random() < settings.runaway;
      state.bugs.push({ sp, x: c.x + Math.cos(a) * d * (i ? 1 : -1), y: c.y + Math.sin(a) * d * (i ? 1 : -1), ang: Math.random() * Math.PI * 2,
        state: walk ? 'walk' : 'still', roll: 0, leg: 0, twitch: 0, stopT: walk ? 0.8 : 0, turnT: rnd(0.5, 2), held: null, rare: sp.rare });
      any = true;
      if (sp.rare) SFX.sparkle();
    });
    if (any) { SFX.found(); speak('いた！'); burst(c.x, c.y, 'spark', 10); }
    if (c.critter) state.critters.push({ cr: c.critter, x: c.x, y: c.y, ang: Math.random() * Math.PI * 2, state: 'idle', t: 0, leg: 0, tapped: false });
    c.bugs = []; c.critter = null;
  }, 220);
}
function collect(b) {
  b.state = 'curl'; b.t = 0; b.held = null;
  SFX.curl();
  burst(b.x, b.y, 'spark', b.rare ? 14 : 6);
}
function tapCritter(c) {
  speak(c.cr.say); SFX.boing();
  if (!c.tapped) {
    c.tapped = true;
    save.critters[c.cr.id] = (save.critters[c.cr.id] || 0) + 1; persist();
    state.banner = { kind: 'critter', sp: c.cr, t: 0 };
  }
  c.state = 'react'; c.t = 0;
}

/* ---------- 更新 ---------- */
function update(dt) {
  state.time += dt;
  const A = L.area;
  // ぼう
  const sk = state.stick;
  sk.x += (sk.tx - sk.x) * Math.min(1, dt * 14); sk.y += (sk.ty - sk.y) * Math.min(1, dt * 14);
  sk.poke = Math.max(0, sk.poke - dt * 4);

  for (const c of state.covers) { if (c.lifted) c.t = Math.min(1, c.t + dt / 0.6); c.wob = Math.max(0, c.wob - dt * 1.5); }
  state.covers = state.covers.filter(c => !(c.type === 'leaf' && c.lifted && c.t >= 1));

  for (const b of state.bugs) {
    b.twitch += dt;
    if (b.state === 'walk') {
      if (b.held) {
        b.held.t += dt;
        const f = b.held.t / settings.hold;
        if (Math.floor(f * 6) !== Math.floor((f - dt / settings.hold) * 6)) SFX.holdTick(f);
        if (f >= 1) { const id = b.held.id; state.pointers.delete(id); collect(b); continue; }
      } else if (b.stopT > 0) b.stopT -= dt;
      else {
        const sp = BL * 0.55;
        b.turnT -= dt;
        if (b.turnT <= 0) { b.ang += rnd(-1.2, 1.2); b.turnT = rnd(0.6, 2.2); if (Math.random() < 0.2) b.stopT = rnd(0.5, 1.2); }
        // 画面のはしでは まん中へ むきをかえる（にげきらない）
        const m = BL * 0.8;

function makeIcons() {
  for (const sp of BUGS) ICONS[sp.id] = iconURL(g => drawDango(g, sp, 120, 125, 170 / sp.size * Math.min(1, sp.size + 0.15), -Math.PI / 2, 0, 0, 0));
  for (const cr of CRITTERS) ICONS[cr.id] = iconURL(g => drawCritterIcon(g, cr.id, 120, 120, 170));
}
function openZukan() {
  state.paused = true;
  for (const id of [...state.pointers.keys()]) releaseHold(id, false);
  const fill = (grid, list, counts, unit) => {
    grid.innerHTML = '';
    for (const sp of list) {
      const n = counts[sp.id] || 0, c = document.createElement('button');
      c.className = 'card' + (n ? '' : ' no');
      c.innerHTML = `<img src="${ICONS[sp.id]}" alt=""><div class="nm${n && sp.kana.length > 6 ? ' long' : ''}">${n ? sp.kana : '？'}</div><div class="ct">${n ? n + unit : ''}</div>`;
      c.addEventListener('click', () => {
        audioInit(); c.classList.remove('wig'); void c.offsetWidth; c.classList.add('wig');
        if (n) { SFX.plop(); speak(sp.say.split('！')[0]); } else { SFX.boing(); speak('まだ みつけてないよ'); }
      });
      grid.appendChild(c);
    }
  };
  fill($('#zgrid'), BUGS, save.counts, 'ひき');
  fill($('#zgrid2'), CRITTERS, save.critters, 'かい');
  $('#ztotal').textContent = save.total ? `だんごむし ぜんぶで ${save.total}ひき` : '';
  $('#zukan').classList.remove('hidden');
  SFX.plop();
}
$('#zclose').addEventListener('click', () => { $('#zukan').classList.add('hidden'); state.paused = false; SFX.plop(); });

/* ---------- せってい ---------- */
function syncSettingsUI() {
  document.querySelectorAll('.seg').forEach(seg => {
    const k = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(settings[k]) === b.dataset.v));
  });
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v, k = seg.dataset.key;
  settings[k] = v === 'true' ? true : v === 'false' ? false : parseFloat(v);
  store.set(SET_KEY, settings); syncSettingsUI();
}));
function openSettings() { state.paused = true; for (const id of [...state.pointers.keys()]) releaseHold(id, false); syncSettingsUI(); $('#settings').classList.remove('hidden'); }
$('#sclose').addEventListener('click', () => {
  $('#settings').classList.add('hidden'); state.paused = false;
  if (state.started && settings.target !== state.target && !state.clear) { // かずを変えたら 新しく はじめる
    state.target = settings.target; layoutSlots(); newStage();
  }
});
$('#sreset').addEventListener('click', () => {
  if (!confirm('あつめた だんごむしの きろくを ぜんぶ けしますか？')) return;
  save.counts = {}; save.critters = {}; save.total = 0; persist();
});

/* ---------- はじまり ---------- */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });
resize();
makeIcons();
$('#startImg').src = ICONS.oka;
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__dg = { state, save, settings, BUGS, L: () => L, ICONS };
</script>
</body>
