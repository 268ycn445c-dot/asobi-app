<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="どんぐり">
<meta name="theme-color" content="#7ec8f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>どんぐり おさんぽ</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7ec8f0;}
  body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;color:#4a2c12}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
  .hidden{display:none !important}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

  /* はじめ */
  #start{background:rgba(126,200,240,.55);cursor:pointer}
  #start h1{margin:0 0 2vmin;font-size:clamp(40px,11vmin,110px);color:#fff;letter-spacing:.06em;
    text-shadow:0 4px 0 #8a5a2b,0 0 18px rgba(0,0,0,.15);text-align:center;line-height:1.15}
  #start img{width:clamp(120px,32vmin,280px);animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
  #start .tap{margin-top:3vmin;font-size:clamp(28px,8vmin,72px);animation:tap 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6%) rotate(6deg)}}
  @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-20%)}}

  /* ずかん */
  #zukan{background:#fff6e4;justify-content:flex-start;overflow:auto;touch-action:pan-y;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px);box-sizing:border-box}
  .zhead{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ztitle{font-size:clamp(28px,6vmin,52px);font-weight:bold}
  .bigx{width:clamp(64px,13vmin,96px);height:clamp(64px,13vmin,96px);border-radius:50%;border:none;background:#e8604c;color:#fff;
    font-size:clamp(32px,7vmin,52px);box-shadow:0 5px 0 #b13e2d;flex:none}
  .bigx:active{transform:translateY(4px);box-shadow:0 1px 0 #b13e2d}
  .zsub{width:100%;max-width:980px;margin-top:18px;font-size:clamp(22px,4.5vmin,34px);font-weight:bold;color:#9a7448}
  #zgrid,#zgrid2{width:100%;max-width:980px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-top:8px}
  .card{background:#fff;border:4px solid #e9cf9c;border-radius:22px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .card img{height:clamp(90px,16vmin,140px)}
  .card.no img{filter:brightness(0);opacity:.16}
  .card .nm{font-size:clamp(20px,3.6vmin,30px);font-weight:bold;white-space:nowrap}
  .card .nm.long{font-size:clamp(15px,2.7vmin,22px)}
  .card .ct{font-size:clamp(16px,3.2vmin,22px);color:#9a7448}
  .card.wig{animation:wig .5s}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
  #zfriends{width:100%;max-width:980px;margin-top:20px;font-size:clamp(40px,9vmin,72px);text-align:center;line-height:1.3}
  #zfriends .lb{display:block;font-size:clamp(20px,4vmin,30px);font-weight:bold}

  /* せってい */
  #settings{background:rgba(40,30,20,.55)}
  .sbox{background:#fff;border-radius:22px;padding:20px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;box-sizing:border-box;touch-action:pan-y}
  .sbox h2{margin:0 0 12px;font-size:24px}
  .row{margin:14px 0}
  .row .lb{font-size:17px;font-weight:bold;margin-bottom:6px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:12px 4px;font-size:17px;border-radius:12px;border:2px solid #d9c19a;background:#fffaf0}
  .seg button.on{background:#f0a830;border-color:#c98410;color:#fff;font-weight:bold}
  .sbtns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .sbtns button,.sbtns a{padding:14px;font-size:17px;border-radius:12px;border:none;background:#eee;text-align:center;text-decoration:none;color:#333}
  .sbtns .close{background:#5aa845;color:#fff;font-weight:bold}
  .sbtns .danger{background:#fbe3df;color:#b13e2d}
  .note{font-size:13px;color:#777;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="cv"></canvas>

<div id="start" class="ov">
  <h1>どんぐり<br>おさんぽ</h1>
  <img id="startImg" alt="">
  <div class="tap">👆</div>
</div>

<div id="zukan" class="ov hidden">
  <div class="zhead"><div class="ztitle">📖 ずかん</div><button class="bigx" id="zclose" aria-label="とじる">✕</button></div>
  <div class="zsub">どんぐり</div>
  <div id="zgrid"></div>
  <div class="zsub">くも</div>
  <div id="zgrid2" class="zgrid"></div>
  <div id="zfriends"></div>
</div>

<div id="settings" class="ov hidden">
  <div class="sbox">
    <h2>せってい（おとなよう）</h2>
    <div class="row"><div class="lb">こえ（なまえの よみあげ）</div><div class="seg" data-key="voice"><button data-v="true">あり</button><button data-v="false">なし</button></div></div>
    <div class="row"><div class="lb">こうかおん</div><div class="seg" data-key="sfx"><button data-v="true">あり</button><button data-v="false">なし</button></div></div>
    <div class="row"><div class="lb">あるく はやさ</div><div class="seg" data-key="speed"><button data-v="0.6">ゆっくり</button><button data-v="1">ふつう</button><button data-v="1.5">はやい</button></div></div>
    <div class="row"><div class="lb">どんぐりの かず</div><div class="seg" data-key="density"><button data-v="0.6">すくない</button><button data-v="1">ふつう</button><button data-v="1.5">おおい</button></div></div>
    <div class="sbtns">
      <button class="close" id="sclose">とじる</button>
      <a href="../">ほかの あそびへ</a>
      <button class="danger" id="sreset">きろくを ぜんぶ けす</button>
    </div>
    <div class="note">iPhone・iPad で音が出ないときは、本体の消音スイッチ（マナーモード）を確認してください。<br>この画面は右下の ⚙ を長押しすると開きます。</div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');

/* ---------- 保存 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const SAVE_KEY = 'donguri-save-v1', SET_KEY = 'donguri-settings-v1';
const save = Object.assign({ counts: {}, total: 0, friends: [], spiders: {}, spiderTotal: 0 }, store.get(SAVE_KEY, {}));
const settings = Object.assign({ voice: true, sfx: true, speed: 1, density: 1 }, store.get(SET_KEY, {}));
const persist = () => store.set(SAVE_KEY, save);

/* ---------- どんぐりの絵（SVG） ---------- */
function nutPath(cx, cy, rx, ry, tip) {
  return `M${cx-rx} ${cy} C${cx-rx} ${cy-ry*1.25} ${cx+rx} ${cy-ry*1.25} ${cx+rx} ${cy} ` +
         `C${cx+rx} ${cy+ry*0.7} ${cx+rx*0.4} ${cy+ry} ${cx} ${cy+ry+tip} ` +
         `C${cx-rx*0.4} ${cy+ry} ${cx-rx} ${cy+ry*0.7} ${cx-rx} ${cy} Z`;
}
function nutSVG(id, cx, cy, rx, ry, c1, c2, tip, gloss = 0.35) {
  return `<defs><radialGradient id="n${id}" cx="38%" cy="35%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>
  <path d="${nutPath(cx, cy, rx, ry, tip)}" fill="url(#n${id})" stroke="#3a1f0b" stroke-width="2.2"/>
  <path d="M${cx-rx*0.5} ${cy-ry*0.3} Q${cx-rx*0.6} ${cy+ry*0.45} ${cx-rx*0.18} ${cy+ry*0.9}" stroke="#fff" stroke-opacity=".13" stroke-width="3" fill="none"/>
  <path d="M${cx+rx*0.5} ${cy-ry*0.3} Q${cx+rx*0.6} ${cy+ry*0.45} ${cx+rx*0.18} ${cy+ry*0.9}" stroke="#000" stroke-opacity=".12" stroke-width="3" fill="none"/>
  <ellipse cx="${cx-rx*0.42}" cy="${cy+ry*0.05}" rx="${rx*0.17}" ry="${ry*0.33}" fill="#fff" opacity="${gloss}"/>
  <circle cx="${cx}" cy="${cy+ry+tip}" r="2.4" fill="#3a1f0b"/>`;
}
function cupPath(cx, yt, yb, w) {
  const h = w / 2;
  return `M${cx-h} ${yb} C${cx-h} ${yt} ${cx+h} ${yt} ${cx+h} ${yb} Q${cx} ${yb+w*0.12} ${cx-h} ${yb} Z`;
}
// cap: type = scale | ring | shaggy
function capSVG(id, o) {
  const { cx = 50, yb, vis, w, col, dark, type } = o;
  const yt = yb - vis / 0.75, top = yb - vis, h = w / 2;
  let tex = '';
  if (type === 'scale') {
    const step = o.step || 6;
    for (let y = top + 2, r = 0; y < yb + 6; y += step, r++) {
      for (let x = cx - h - 4 + (r % 2) * step / 2; x < cx + h + 4; x += step + 1) {
        tex += `<path d="M${x-step/2} ${y} Q${x} ${y+step*0.75} ${x+step/2} ${y}" stroke="${dark}" stroke-width="1.6" fill="none"/>`;
      }
    }
  } else if (type === 'ring') {
    const n = o.rings || 6;
    for (let i = 1; i <= n; i++) {
      const y = top + (yb - top + 4) * i / (n + 0.5);
      tex += `<path d="M${cx-h-2} ${y+4} Q${cx} ${y-6} ${cx+h+2} ${y+4}" stroke="${dark}" stroke-width="2.2" fill="none"/>`;
    }
  }
  let fringe = '', rim = '';
  if (type === 'shaggy') {
    const L = o.len || 12, ry = vis * 0.9, ccy = yb - vis * 0.25;
    const layers = o.long ? [[1.0, 30, 2.6], [0.75, 24, 3.2]] : [[1.0, 26, 3.6], [0.7, 22, 3.8]];
    for (const [f, n, sw] of layers) {
      for (let i = 0; i <= n; i++) {
        const a = Math.PI * (1.02 + 0.96 * i / n);
        const px = cx + Math.cos(a) * h * 0.92, py = ccy + Math.sin(a) * ry * 0.95;
        const dx = Math.cos(a), dy = Math.sin(a), l = L * f * (0.8 + 0.4 * ((i * 37) % 7) / 7);
        const sg = (i % 2 ? 1 : -1) * (o.long ? 0.7 : 0.5);
        const qx = px + dx * l * 0.6 - dy * l * sg, qy = py + dy * l * 0.6 + dx * l * sg;
        fringe += `<path d="M${px} ${py} Q${qx} ${qy} ${px+dx*l} ${py+dy*l}" stroke="${f === 1 ? dark : col}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
      }
    }
    // ふちから垂れる毛
    for (let x = cx - h + 3; x <= cx + h - 3; x += o.long ? 5 : 6) {
      const l = L * (o.long ? 0.7 : 0.45), d = (x - cx) / h;
      rim += `<path d="M${x} ${yb-2} q${d*4} ${l*0.5} ${d*l*0.5} ${l}" stroke="${col}" stroke-width="${o.long ? 2.6 : 3.4}" stroke-linecap="round" fill="none"/>`;
    }
  }
  const stem = o.stem ? `<rect x="${cx-2.8}" y="${top-8}" width="5.6" height="11" rx="2.5" fill="${dark}"/>` : '';
  return `${stem}<defs><clipPath id="c${id}"><path d="${cupPath(cx, yt, yb, w)}"/></clipPath></defs>
  ${fringe}
  <path d="${cupPath(cx, yt, yb, w)}" fill="${col}" stroke="${dark}" stroke-width="2"/>
  <g clip-path="url(#c${id})">${tex}</g>
  ${rim}`;
}
function shiiSVG(id) {
  const cx = 50, cy = 72, rx = 16, ry = 30;
  return `<g transform="translate(0 ${cy*2+6}) scale(1 -1)">${nutSVG(id, cx, cy, rx, ry, '#7a4622', '#2b160a', 7, 0.3)}</g>
  <path d="M50 116 C64 116 70 98 66 82 C61 92 57 102 50 106 Z" fill="#8f7b55" stroke="#5b4a2e" stroke-width="2"/>
  <path d="M50 116 C36 116 30 98 34 82 C39 92 43 102 50 106 Z" fill="#a08a62" stroke="#5b4a2e" stroke-width="2"/>
  <circle cx="40" cy="100" r="1.4" fill="#5b4a2e"/><circle cx="44" cy="108" r="1.4" fill="#5b4a2e"/><circle cx="60" cy="100" r="1.4" fill="#5b4a2e"/><circle cx="56" cy="108" r="1.4" fill="#5b4a2e"/>`;
}
const wrap = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="200" height="280">${inner}</svg>`;

const SPECIES = [
  { id: 'kunugi', name: 'クヌギ', kana: 'くぬぎ', weight: 20, size: 1.1,
    svg: () => nutSVG('ku', 50, 88, 31, 30, '#b5733a', '#6e3b16', 4) + capSVG('ku', { yb: 72, vis: 26, w: 76, col: '#8d6b3f', dark: '#5e4524', type: 'shaggy', len: 12 }) },
  { id: 'konara', name: 'コナラ', kana: 'こなら', weight: 20, size: 0.95,
    svg: () => nutSVG('ko', 50, 84, 20, 36, '#cf9050', '#7d4a1c', 5) + capSVG('ko', { yb: 60, vis: 16, w: 46, col: '#a48a5e', dark: '#6f5a37', type: 'scale', step: 6, stem: true }) },
  { id: 'matebashii', name: 'マテバシイ', kana: 'まてばしい', weight: 18, size: 1.05,
    svg: () => nutSVG('ma', 50, 80, 17, 44, '#96562a', '#4b260d', 4, 0.5) + capSVG('ma', { yb: 46, vis: 12, w: 40, col: '#a99470', dark: '#75633f', type: 'scale', step: 5 }) },
  { id: 'sudajii', name: 'スダジイ', kana: 'すだじい', weight: 14, size: 0.72,
    svg: () => shiiSVG('su') },
  { id: 'arakashi', name: 'アラカシ', kana: 'あらかし', weight: 12, size: 0.9,
    svg: () => nutSVG('ar', 50, 88, 22, 31, '#b3733a', '#5d3313', 5) + capSVG('ar', { yb: 74, vis: 22, w: 52, col: '#8f8d70', dark: '#5d5b45', type: 'ring', rings: 6 }) },
  { id: 'shirakashi', name: 'シラカシ', kana: 'しらかし', weight: 9, size: 0.85,
    svg: () => nutSVG('sh', 50, 90, 17, 30, '#8e5a2a', '#40230d', 5) + capSVG('sh', { yb: 75, vis: 20, w: 42, col: '#7f826b', dark: '#50523f', type: 'ring', rings: 7 }) },
  { id: 'mizunara', name: 'ミズナラ', kana: 'みずなら', weight: 5, size: 1.05, rare: true,
    svg: () => nutSVG('mi', 50, 86, 25, 34, '#c48a4c', '#78471c', 5) + capSVG('mi', { yb: 70, vis: 24, w: 60, col: '#96794f', dark: '#64502f', type: 'scale', step: 8 }) },
  { id: 'kashiwa', name: 'カシワ', kana: 'かしわ', weight: 2, size: 1.1, rare: true,
    svg: () => nutSVG('ka', 50, 90, 28, 29, '#c08347', '#74431b', 4) + capSVG('ka', { yb: 74, vis: 24, w: 72, col: '#c4a676', dark: '#8a6f45', type: 'shaggy', len: 19, long: true }) },
];
/* ---------- クモの絵（SVG・こわくない丸い顔） ----------
   viewBox はどんぐりと同じ 100x140。クモの中心は (50,80)。 */
function spiderSVG(id, o) {
  const { rx, ry, base, legs, band, pat } = o, ay = 80 + 4 + ry * 0.55;
  let legsSvg = '';
  for (const sd of [-1, 1]) for (let k = 0; k < 4; k++) {
    const by = 66 + k * 6, kx = 50 + sd * (26 + k * 2), ky = by - 16 + k * 10, fx = 50 + sd * (40 - Math.abs(k - 1.5) * 2), fy = by + 2 + k * 12;
    legsSvg += `<polyline points="${50 + sd * 8},${by} ${kx},${ky} ${fx},${fy}" fill="none" stroke="${legs}" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (band) legsSvg += `<circle cx="${kx}" cy="${ky}" r="2.6" fill="${band}"/>`;
  }
  let p = '';
  const clip = `<clipPath id="a${id}"><ellipse cx="50" cy="${ay}" rx="${rx}" ry="${ry}"/></clipPath>`;
  if (pat === 'stripes') for (let y = ay - ry; y < ay + ry; y += o.step) p += `<rect x="0" y="${y}" width="100" height="${o.step * 0.45}" fill="${o.c2}"/>`;
  if (pat === 'stripes3') for (let y = ay - ry, i = 0; y < ay + ry; y += o.step, i++) p += `<rect x="0" y="${y}" width="100" height="${o.step * 0.5}" fill="${i % 2 ? o.c3 : o.c2}"/>`;
  if (pat === 'leaf') p = `<path d="M50 ${ay - ry + 4} L${50 - rx * 0.7} ${ay + ry * 0.2} L50 ${ay + ry - 3} L${50 + rx * 0.7} ${ay + ry * 0.2} Z" fill="${o.c2}"/><path d="M50 ${ay - ry + 10} L${50 - rx * 0.4} ${ay + ry * 0.1} L50 ${ay + ry - 10} L${50 + rx * 0.4} ${ay + ry * 0.1} Z" fill="${base}"/>`;
  if (pat === 'dots') for (const [dx, dy] of [[-6, -6], [6, -4], [-4, 5], [5, 7], [0, -1]]) p += `<circle cx="${50 + dx}" cy="${ay + dy}" r="2.2" fill="${o.c2}"/>`;
  if (o.red) p += `<ellipse cx="50" cy="${ay + ry - 4}" rx="${rx * 0.5}" ry="5" fill="#d8402f"/>`;
  return `<defs>${clip}</defs>${legsSvg}
  <ellipse cx="50" cy="${ay}" rx="${rx}" ry="${ry}" fill="${base}"/>
  <g clip-path="url(#a${id})">${p}</g>
  <ellipse cx="50" cy="${ay}" rx="${rx}" ry="${ry}" fill="none" stroke="#2a2018" stroke-width="2"/>
  <ellipse cx="${50 - rx * 0.35}" cy="${ay - ry * 0.45}" rx="${rx * 0.2}" ry="${ry * 0.15}" fill="#fff" opacity=".35"/>
  <ellipse cx="50" cy="68" rx="15" ry="13" fill="${o.head || '#3a2c22'}" stroke="#2a2018" stroke-width="2"/>
  <circle cx="44" cy="66" r="5.2" fill="#fff"/><circle cx="56" cy="66" r="5.2" fill="#fff"/>
  <circle cx="45" cy="67" r="2.8" fill="#111"/><circle cx="57" cy="67" r="2.8" fill="#111"/>
  <circle cx="44" cy="65.6" r="1" fill="#fff"/><circle cx="56" cy="65.6" r="1" fill="#fff"/>
  <path d="M46 73 Q50 76 54 73" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
}
const SPIDERS = [
  { id: 'jorou', name: 'ジョロウグモ', kana: 'じょろうぐも', weight: 30, size: 1.0, deco: null,
    svg: () => spiderSVG('jo', { rx: 13, ry: 22, base: '#f2c230', pat: 'stripes', c2: '#2f5f5a', step: 7, red: true, legs: '#2a2018', band: '#f2c230' }) },
  { id: 'kogane', name: 'コガネグモ', kana: 'こがねぐも', weight: 25, size: 1.05, deco: 'x',
    svg: () => spiderSVG('kg', { rx: 18, ry: 18, base: '#f3c623', pat: 'stripes', c2: '#2a2018', step: 8, legs: '#2a2018', band: '#f3c623' }) },
  { id: 'nagakogane', name: 'ナガコガネグモ', kana: 'ながこがねぐも', weight: 20, size: 1.0, deco: 'zig',
    svg: () => spiderSVG('ng', { rx: 11, ry: 22, base: '#fbf3d0', pat: 'stripes3', c2: '#2a2018', c3: '#f3c623', step: 5, legs: '#6b5a3a', band: '#f3c623', head: '#d8d2b8' }) },
  { id: 'oni', name: 'オニグモ', kana: 'おにぐも', weight: 18, size: 1.1, deco: null,
    svg: () => spiderSVG('on', { rx: 20, ry: 18, base: '#9a6638', pat: 'leaf', c2: '#5e3a1e', legs: '#5e3a1e', band: '#b98a5a' }) },
  { id: 'ginmekki', name: 'ギンメッキゴミグモ', kana: 'ぎんめっきごみぐも', weight: 7, size: 0.85, deco: 'zig', rare: true,
    svg: () => spiderSVG('gm', { rx: 13, ry: 13, base: '#e3e8ee', pat: 'dots', c2: '#8d96a0', legs: '#5a5f66', head: '#5a5f66' }) },
];
function pickSpider() {
  let r = Math.random() * SPIDERS.reduce((a, s) => a + s.weight, 0);
  for (const s of SPIDERS) { if ((r -= s.weight) < 0) return s; }
  return SPIDERS[0];
}

const ANIMALS = [
  { e: '🐿️', k: 'りす' }, { e: '🐰', k: 'うさぎ' }, { e: '🦔', k: 'はりねずみ' }, { e: '🦝', k: 'たぬき' },
  { e: '🦊', k: 'きつね' }, { e: '🐻', k: 'くま' }, { e: '🦉', k: 'ふくろう' }, { e: '🐗', k: 'いのしし' },
];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function loadImages() {
  return Promise.all(SPECIES.concat(SPIDERS).map(sp => new Promise(res => {
    sp.url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wrap(sp.svg()));
    const img = new Image();
    img.onload = () => { sp.img = img; res(); };
    img.onerror = () => res();
    img.src = sp.url;
  })));
}
function pickSpecies() {
  let r = Math.random() * SPECIES.reduce((a, s) => a + s.weight, 0);
  for (const s of SPECIES) { if ((r -= s.weight) < 0) return s; }
  return SPECIES[0];
}

/* ---------- おと ---------- */
let AC = null;
function audioInit() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol = 0.25, delay = 0) {
  if (!settings.sfx || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol = 0.2) {
  if (!settings.sfx || !AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}
const SFX = {
  pick() { tone('sine', 520, 1250, 0.14, 0.3); tone('triangle', 900, 1800, 0.1, 0.12, 0.05); },
  plop() { tone('triangle', 340, 170, 0.16, 0.28); },
  rustle() { noise(0.28, 2600, 0.35); },
  boing() { tone('sine', 220, 520, 0.22, 0.28); },
  boyon() { tone('sine', 300, 180, 0.12, 0.25); tone('sine', 260, 420, 0.18, 0.2, 0.1); },
  sparkle() { [1568, 2093, 2637].forEach((f, i) => tone('sine', f, f * 1.01, 0.18, 0.12, i * 0.07)); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('triangle', f, f, i === 5 ? 0.5 : 0.16, 0.25, i * 0.13)); },
};

/* ---------- こえ ---------- */
let jaVoice = null;
function findVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    jaVoice = vs.find(v => /Kyoko|O-ren|Nanami|Google/i.test(v.name)) || vs[0] || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
function speak(text, rate = 0.85) {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = rate; u.pitch = 1.15;
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- けしき ---------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const PALETTES = [
  { sky1: '#7ec8f0', sky2: '#dff3ff', hill1: '#b4dd95', hill2: '#86c56a', crowns: ['#5aa845', '#6dbb52', '#4f9a3c'], trunk: '#7a5230', ground: '#9ccf6a', ground2: '#93c762', path: '#ecd7ab', path2: '#e4cd9e', edge: '#d4b886', leaf: ['#6dbb52', '#9ccf6a', '#c9a35a'] },
  { sky1: '#9fd8e8', sky2: '#eaf7ef', hill1: '#7bb874', hill2: '#56995a', crowns: ['#3f8a3f', '#2f7a3a', '#4c9a48'], trunk: '#5e3d22', ground: '#78b45c', ground2: '#6fab53', path: '#dcc597', path2: '#d3bb8b', edge: '#bba273', leaf: ['#3f8a3f', '#78b45c', '#a8c060'] },
  { sky1: '#f4bf86', sky2: '#fdeed8', hill1: '#e0a060', hill2: '#cc7a3e', crowns: ['#e07b2e', '#e2b03a', '#c94b2e'], trunk: '#6b4224', ground: '#cfae62', ground2: '#c6a458', path: '#efd9ab', path2: '#e7cf9e', edge: '#d1b07a', leaf: ['#e07b2e', '#e2b03a', '#c94b2e'] },
].map(p => { const o = {}; for (const k in p) o[k] = Array.isArray(p[k]) ? p[k].map(hex) : hex(p[k]); return o; });
function mixPalette(a, b, f) {
  const m = (x, y) => `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * f)).join(',')})`;
  const o = {};
  for (const k in a) o[k] = Array.isArray(a[k][0]) ? a[k].map((c, i) => m(c, b[k][i])) : m(a[k], b[k]);
  return o;
}
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- 3D（歩く人の目線） ----------
   世界の単位はメートル。x = 横、z = 前。カメラは道の真ん中を前へ進む。 */
const CAM_H = 1.1, FAR = 36, NEAR = 1.7, ROAD_HW = 0.85, STRIPE = 0.9, NUT_H = 0.5, NUT_FAR = 24;
const roadCenter = z => 1.5 * Math.sin(z * 0.045) + 0.6 * Math.sin(z * 0.11 + 1);

/* ---------- じょうたい ---------- */
let W = 0, H = 0, DPR = 1, M = 0, D = 80, F = 800, HOR0 = 300, HOR = 300, CAMX = 0;
const safe = { t: 0, r: 0, b: 0, l: 0 };
const L = {};
const state = {
  started: false, paused: false, time: 0, camZ: 0, speed: 0,
  nuts: [], trees: [], decos: [], webs: [], nutZ: 6, treeZ: 2, decoZ: 2, webZ: 9,
  flying: [], parts: [], banner: null,
  walkPhase: 0, friendJump: {}, basketBounce: 0,
  reward: null, rewardQueue: 0,
  scene: Math.floor(save.total / 10) % 3, prevScene: Math.floor(save.total / 10) % 3, sceneMix: 1,
  gearHold: null,
};

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; M = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle($('#safe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
  D = Math.max(64, Math.min(M * 0.17, 140));
  HOR0 = H * (H > W ? 0.42 : 0.38);
  F = (H - HOR0) * 2.0 / CAM_H; // 2m先の地面が画面のいちばん下
  L.pad = 14;
  L.btn = Math.max(66, Math.min(M * 0.15, 110));
  L.zukan = { x: safe.l + L.pad + L.btn / 2, y: safe.t + L.pad + L.btn / 2, r: L.btn / 2 };
  L.basket = { w: L.btn * 2.0, h: L.btn };
  L.basket.x = W - safe.r - L.pad - L.basket.w; L.basket.y = safe.t + L.pad;
  L.basketTarget = { x: L.basket.x + L.basket.h * 0.55, y: L.basket.y + L.basket.h * 0.5 };
  L.spiderBox = { w: L.basket.w * 0.8, h: L.basket.h * 0.8 };
  L.spiderBox.x = W - safe.r - L.pad - L.spiderBox.w; L.spiderBox.y = L.basket.y + L.basket.h + 10;
  L.spiderTarget = { x: L.spiderBox.x + L.spiderBox.h * 0.55, y: L.spiderBox.y + L.spiderBox.h * 0.5 };
  L.gear = { x: W - safe.r - 30, y: H - safe.b - 30, r: 22 };
  // どんぐりを置く横はば：4〜5m先で画面に入るくらい
  L.xRange = Math.max(0.55, Math.min(2.2, 0.8 * (W / 2) * 5 / F));
}
function proj(x, z) {
  const dz = z - state.camZ, s = F / dz;
  return { x: W / 2 + (x - CAMX) * s, y: HOR + CAM_H * s, s, dz };
}

/* ---------- 世界をつくる（ランダムに散らばる） ---------- */
function genWorld() {
  const zMax = state.camZ + FAR;
  while (state.nutZ < zMax) {
    const z = state.nutZ, cx = roadCenter(z) + rnd(-1, 1) * L.xRange;
    if (Math.random() < 0.3) { // ときどき かたまって落ちている
      const sp = Math.random() < 0.5 ? pickSpecies() : null, n = 2 + (Math.random() < 0.4);
      for (let i = 0; i < n; i++) addNut(cx + rnd(-0.35, 0.35), z + rnd(0, 0.6), sp || pickSpecies());
    } else addNut(cx, z, pickSpecies());
    // 間かくはバラバラ（短いことが多く、ときどき長い）
    state.nutZ += (0.8 + Math.random() * Math.random() * 5) / settings.density;
  }
  while (state.treeZ < zMax) {
    const z = state.treeZ, side = Math.random() < 0.5 ? -1 : 1;
    state.trees.push({ x: roadCenter(z) + side * rnd(1.9, 6.5), z, h: rnd(3, 5.5), v: Math.random(), conifer: Math.random() });
    state.treeZ += rnd(0.5, 3.2);
  }
  while (state.decoZ < zMax) {
    const z = state.decoZ, x = roadCenter(z) + rnd(-6, 6), onRoad = Math.abs(x - roadCenter(z)) < ROAD_HW;
    state.decos.push({ x, z, onRoad, t: Math.random(), size: rnd(0.12, 0.3) });
    state.decoZ += rnd(0.12, 0.6);
  }
  while (state.webZ < zMax) {
    const z = state.webZ, side = Math.random() < 0.5 ? -1 : 1;
    const off = Math.max(0.45, Math.min(2.4, L.xRange * rnd(0.7, 1.15)));
    state.webs.push({ x: roadCenter(z) + side * off, z, hgt: rnd(0.75, 1.15), r: rnd(0.3, 0.42), rot: Math.random(), sp: pickSpider(), wob: 0, phase: Math.random() * 10, sx: -999, sy: -999, sr: 0 });
    state.webZ += rnd(6, 15);
  }
  const keep = o => o.z - state.camZ > 1.0;
  state.trees = state.trees.filter(keep); state.decos = state.decos.filter(keep); state.webs = state.webs.filter(keep);
  state.nuts = state.nuts.filter(n => n.z - state.camZ > NEAR - 0.1);
}
function addNut(x, z, sp) { state.nuts.push({ sp, x, z, phase: Math.random() * 10, sx: -999, sy: -999, ph: 0 }); }

/* ---------- タップ ---------- */
function onTap(px, py) {
  audioInit();
  if (!state.started || state.paused) return;
  if (Math.hypot(px - L.zukan.x, py - L.zukan.y) < L.zukan.r + 8) { openZukan(); return; }
  const b = L.basket;
  if (px > b.x - 8 && px < b.x + b.w + 8 && py > b.y - 8 && py < b.y + b.h + 8) {
    state.basketBounce = 1; SFX.plop(); speak(`${save.total}こ`); return;
  }
  const sb = L.spiderBox;
  if (save.spiderTotal > 0 && px > sb.x - 8 && px < sb.x + sb.w + 8 && py > sb.y - 4 && py < sb.y + sb.h + 8) {
    state.spiderBounce = 1; SFX.boyon(); speak(`くも ${save.spiderTotal}ひき`); return;
  }
  // どんぐり：近い（大きい）ものを優先
  let best = null, bd = 1e9;
  for (const n of state.nuts) {
    if (n.ph <= 0) continue;
    const cy = n.sy - n.ph * 0.45, r = Math.max(n.ph * 0.65, 46), d = Math.hypot(px - n.sx, py - cy);
    if (d < r && d / r < bd) { best = n; bd = d / r; }
  }
  if (best) { pickNut(best); return; }
  // クモの巣
  for (const w of state.webs) {
    if (w.sr <= 0) continue;
    if (Math.hypot(px - w.sx, py - w.sy) < Math.max(w.sr * 1.1, 50)) {
      w.wob = 1;
      if (w.sp) pickSpiderFrom(w); else { SFX.boyon(); burst(px, py, 'spark', 3); }
      return;
    }
  }
  for (const f of friendSlots()) {
    if (Math.abs(px - f.x) < f.size * 0.5 && py > f.y - f.size && py < f.y + 10) {
      if (!(state.friendJump[f.i] > 0)) { state.friendJump[f.i] = 1; SFX.boing(); }
      return;
    }
  }
  SFX.rustle();
  burst(px, py, 'leaf', 7);
}
function pickNut(n) {
  state.nuts.splice(state.nuts.indexOf(n), 1);
  SFX.pick();
  if (n.sp.rare) SFX.sparkle();
  const cy = n.sy - n.ph * 0.45;
  burst(n.sx, cy, 'spark', n.sp.rare ? 14 : 7);
  state.flying.push({ sp: n.sp, x0: n.sx, y0: cy, h0: Math.max(n.ph, D * 0.5), t: 0 });
  state.banner = { sp: n.sp, t: 0 };
  speak(n.sp.name);
}
function pickSpiderFrom(w) {
  const sp = w.sp; w.sp = null;
  SFX.boyon(); SFX.pick();
  if (sp.rare) SFX.sparkle();
  burst(w.sx, w.sy, 'spark', sp.rare ? 14 : 8);
  state.flying.push({ sp, kind: 'spider', x0: w.sx, y0: w.sy, h0: Math.max(w.sr * 1.2, D * 0.6), t: 0 });
  state.banner = { sp, t: 0 };
  speak(sp.name);
}
function arrive(f) {
  SFX.plop();
  if (f.kind === 'spider') {
    state.spiderBounce = 1;
    save.spiderTotal = (save.spiderTotal || 0) + 1;
    save.spiders[f.sp.id] = (save.spiders[f.sp.id] || 0) + 1;
    persist();
    return;
  }
  state.basketBounce = 1;
  save.total++;
  save.counts[f.sp.id] = (save.counts[f.sp.id] || 0) + 1;
  if (save.total % 10 === 0) {
    save.friends.push((save.total / 10 - 1) % ANIMALS.length);
    if (state.reward) state.rewardQueue++; else startReward();
  }
  persist();
}

/* ---------- ごほうび ---------- */
function startReward() {
  const ai = save.friends[save.friends.length - 1 - state.rewardQueue];
  state.reward = { ai, t: 0, spoke: false, sceneChanged: false };
  SFX.fanfare();
  setTimeout(() => speak('やったー！', 0.9), 150);
  for (let i = 0; i < 40; i++) burst(Math.random() * W, -20, 'confetti', 1);
}
function updateReward(dt) {
  const r = state.reward; if (!r) return;
  r.t += dt;
  if (!r.spoke && r.t > 1.6) { r.spoke = true; speak(`${ANIMALS[r.ai].k}さんが きたよ！`); }
  if (!r.sceneChanged && r.t > 3.2) {
    r.sceneChanged = true;
    state.prevScene = state.scene; state.scene = Math.floor(save.total / 10) % 3; state.sceneMix = 0;
  }
  if (r.t < 3 && Math.random() < dt * 8) burst(Math.random() * W, -20, 'confetti', 2);
  if (r.t > 5) {
    state.reward = null;
    if (state.rewardQueue > 0) { state.rewardQueue--; startReward(); }
  }
}

/* ---------- つぶつぶ ---------- */
function burst(x, y, type, n) {
  const P = curPal;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (type === 'confetti' ? 60 : 160) + Math.random() * 220;
    state.parts.push({
      type, x, y, vx: Math.cos(a) * v * (type === 'confetti' ? 0.6 : 1), vy: type === 'confetti' ? 80 + Math.random() * 120 : Math.sin(a) * v - 120,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, life: 0, max: type === 'confetti' ? 4 : 0.9 + Math.random() * 0.5,
      size: (type === 'spark' ? 0.11 : 0.13) * D * (0.6 + Math.random() * 0.6),
      color: type === 'leaf' ? P.leaf[i % 3] : type === 'confetti' ? ['#f5c542', '#e8604c', '#5aa845', '#4aa3e0', '#e07b2e'][i % 5] : '#fff6a0',
      sp: type === 'confetti' && Math.random() < 0.3 ? SPECIES[Math.floor(Math.random() * SPECIES.length)] : null,
    });
  }
}

/* ---------- なかま（となりを いっしょに歩く） ---------- */
function friendSlots() {
  const n = save.friends.length - (state.reward ? 1 + state.rewardQueue : 0);
  const list = save.friends.slice(0, Math.max(0, n)).map((ai, i) => ({ ai, i })).slice(-4).reverse();
  return list.map((f, k) => {
    const side = k % 2 ? 1 : -1, row = Math.floor(k / 2), size = D * (row ? 0.95 : 1.15);
    const x = side < 0 ? safe.l + W * 0.1 + row * D * 0.95 : W - safe.r - W * 0.1 - row * D * 0.95;
    return { ...f, side, size, x, y: H - safe.b - D * 0.12 - row * D * 0.1 };
  });
}

/* ---------- 更新 ---------- */
function update(dt) {
  state.time += dt;
  const walk = 0.65 * settings.speed;
  const target = state.started ? (!state.paused && !state.reward ? walk : 0) : 0.35;
  state.speed += (target - state.speed) * Math.min(1, dt * 2.5);
  state.camZ += state.speed * dt;
  state.walkPhase += state.speed * dt * 3.2;
  CAMX = roadCenter(state.camZ);
  HOR = HOR0 + Math.sin(state.walkPhase * 2) * H * 0.005 * Math.min(1, state.speed / 0.5);
  genWorld();

  for (const f of state.flying) {
    f.t += dt / 0.75;
    if (f.t >= 1 && !f.done) { f.done = true; arrive(f); }
  }
  state.flying = state.flying.filter(f => !f.done);

  for (const p of state.parts) {
    p.life += dt;
    if (p.type === 'confetti') { p.vy = Math.min(p.vy + 40 * dt, 160); p.vx += Math.sin(state.time * 3 + p.rot) * 30 * dt; }
    else if (p.type === 'leaf') { p.vy += 380 * dt; p.vx *= 0.97; }
    else { p.vy += 200 * dt; p.vx *= 0.94; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  state.parts = state.parts.filter(p => p.life < p.max && p.y < H + 40);

  if (state.banner) { state.banner.t += dt; if (state.banner.t > 2.4) state.banner = null; }
  for (const k in state.friendJump) state.friendJump[k] = Math.max(0, state.friendJump[k] - dt * 1.8);
  state.basketBounce = Math.max(0, state.basketBounce - dt * 3);
  state.spiderBounce = Math.max(0, (state.spiderBounce || 0) - dt * 3);
  for (const w of state.webs) w.wob = Math.max(0, w.wob - dt * 0.9);
  if (state.sceneMix < 1) state.sceneMix = Math.min(1, state.sceneMix + dt / 2.5);
  updateReward(dt);

  // めだつように時々きらっ（近くのものだけ）
  for (const n of state.nuts) {
    if (n.ph > 18 && Math.random() < dt * (n.sp.rare ? 2.5 : 0.6)) burst(n.sx + (Math.random() - 0.5) * n.ph * 0.5, n.sy - n.ph * 0.9, 'spark', 1);
  }
}

/* ---------- 描画 ---------- */
let curPal = mixPalette(PALETTES[state.scene], PALETTES[state.scene], 1);
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function emoji(e, x, y, size, flip = true) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  ctx.fillStyle = '#000'; // 影の半透明色が絵文字にうつらないように
  ctx.font = `${size}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, 0, 0); ctx.restore();
}
// クモの絵を (cx,cy) を体の中心にして描く。size = 画面上の幅(px)
function drawSpider(sp, cx, cy, size, rot = 0) {
  if (!sp.img) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.drawImage(sp.img, -size / 2, -size * 1.4 * 80 / 140, size, size * 1.4); ctx.restore();
}
function drawWeb(w, p) {
  const r = w.r * p.s, cx = p.x, cy = p.y - w.hgt * p.s;
  w.sx = cx; w.sy = cy; w.sr = cx > -r && cx < W + r ? r : 0;
  const wob = Math.sin(state.time * 18) * w.wob * r * 0.08, n = 10;
  ctx.save(); ctx.translate(cx, cy + wob);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(0.8, r * 0.018); ctx.lineCap = 'round';
  // 枝と草につながる糸
  ctx.beginPath();
  ctx.moveTo(-r * 0.7, -r * 0.7); ctx.lineTo(-r * 1.1, -r * 3);
  ctx.moveTo(r * 0.7, -r * 0.7); ctx.lineTo(r * 1.2, -r * 3);
  ctx.moveTo(-r * 0.6, r * 0.8); ctx.lineTo(-r * 0.8, w.hgt * p.s - wob);
  ctx.moveTo(r * 0.6, r * 0.8); ctx.lineTo(r * 0.9, w.hgt * p.s - wob);
  // たて糸
  const pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n + w.rot * 0.1) * Math.PI * 2; pts.push([Math.cos(a), Math.sin(a) * 0.95]); }
  for (const [x, y] of pts) { ctx.moveTo(0, 0); ctx.lineTo(x * r, y * r); }
  // よこ糸（うずまき）
  for (let k = 1; k <= 6; k++) {
    const rr = r * k / 6.3;
    ctx.moveTo(pts[0][0] * rr, pts[0][1] * rr);
    for (let i = 1; i <= n; i++) { const [x, y] = pts[i % n]; ctx.lineTo(x * rr, y * rr); }
  }
  ctx.stroke();
  // かくれおび（コガネグモはX、ナガコガネグモ・ギンメッキはジグザグ）
  const deco = w.deco !== undefined ? w.deco : (w.deco = w.sp && w.sp.deco);
  if (deco) {
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = Math.max(1.2, r * 0.04); ctx.beginPath();
    if (deco === 'x') for (const [x, y] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
      for (let t = 0.2; t < 0.8; t += 0.1) { const d = t * r * 0.8; ctx.moveTo(x * d, y * d); ctx.lineTo(x * (d + r * 0.08) + y * r * 0.03, y * (d + r * 0.08) - x * r * 0.03); }
    } else {
      ctx.moveTo(0, -r * 0.8); for (let t = -0.8; t < 0.8; t += 0.08) ctx.lineTo((Math.round(t * 12.5) % 2 ? 1 : -1) * r * 0.05, t * r);
    }
    ctx.stroke();
  }
  ctx.restore();
  if (w.sp) drawSpider(w.sp, cx, cy + wob + Math.sin(state.time * 2 + w.phase) * r * 0.03, r * 0.95 * w.sp.size);
}
// h = 画面上の高さ(px)、yBottom = 地面の位置
function drawNut(sp, x, yBottom, h, rot = 0) {
  if (!sp.img) return;
  const w = h * 100 / 140;
  ctx.save(); ctx.translate(x, yBottom - h * 0.12); ctx.rotate(rot);
  ctx.drawImage(sp.img, -w / 2, -h * 0.88, w, h); ctx.restore();
}
function drawHills(baseY, amp, freq, color, seed) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, baseY + 2);
  const off = CAMX * 40; // 道が曲がると少しずれる
  for (let x = 0; x <= W + 24; x += 24) {
    const wx = (x + off) / M;
    ctx.lineTo(x, baseY - amp * (0.6 + 0.4 * Math.sin(wx * freq + seed) + 0.25 * Math.sin(wx * freq * 2.3 + seed * 2)));
  }
  ctx.lineTo(W, baseY + 2); ctx.closePath(); ctx.fill();
}
function drawTree(x, baseY, s, t, P) {
  const conifer = state.scene === 1 ? t.conifer > 0.5 : t.conifer > 0.85;
  ctx.fillStyle = P.trunk;
  ctx.fillRect(x - s * 0.05, baseY - s * 0.55, s * 0.1, s * 0.56);
  ctx.fillStyle = P.crowns[Math.floor(t.v * 97) % 3];
  if (conifer) {
    for (let k = 0; k < 3; k++) {
      const y = baseY - s * (0.35 + k * 0.25), w = s * (0.34 - k * 0.08);
      ctx.beginPath(); ctx.moveTo(x - w, y); ctx.lineTo(x + w, y); ctx.lineTo(x, y - s * 0.42); ctx.closePath(); ctx.fill();
    }
  } else {
    circle(x, baseY - s * 0.75, s * 0.28); circle(x - s * 0.2, baseY - s * 0.58, s * 0.2); circle(x + s * 0.2, baseY - s * 0.6, s * 0.22);
    ctx.fillStyle = 'rgba(255,255,255,.13)'; circle(x - s * 0.09, baseY - s * 0.85, s * 0.11);
  }
}
function drawDeco(d, p, P) {
  const x = p.x, y = p.y, sz = d.size * p.s, t = d.t;
  if (sz < 1.5) return;
  if (d.onRoad) {
    ctx.fillStyle = t < 0.5 ? 'rgba(120,100,70,.35)' : P.leaf[Math.floor(t * 9) % 3];
    ctx.beginPath(); ctx.ellipse(x, y, sz * 0.5, sz * 0.22, t * 3, 0, Math.PI * 2); ctx.fill();
  } else if (t < 0.55) { // 草
    ctx.strokeStyle = P.crowns[2]; ctx.lineWidth = Math.max(1, sz * 0.12); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = -1; k <= 1; k++) { ctx.moveTo(x + k * sz * 0.2, y); ctx.quadraticCurveTo(x + k * sz * 0.35, y - sz * 0.7, x + k * sz * 0.6, y - sz); }
    ctx.stroke();
  } else if (t < 0.75) { // 花
    ctx.fillStyle = ['#fff', '#f7d24a', '#f29ab8'][Math.floor(t * 30) % 3];
    for (let k = 0; k < 5; k++) circle(x + Math.cos(k * 1.26) * sz * 0.25, y - sz * 0.7 + Math.sin(k * 1.26) * sz * 0.25, sz * 0.18);
    ctx.fillStyle = '#e8a33a'; circle(x, y - sz * 0.7, sz * 0.14);
  } else if (t < 0.9) { // 石
    ctx.fillStyle = '#a9a39a'; ctx.beginPath(); ctx.ellipse(x, y, sz * 0.5, sz * 0.32, 0, Math.PI, 0); ctx.fill();
  } else { // きのこ
    ctx.fillStyle = '#f3ead8'; ctx.fillRect(x - sz * 0.1, y - sz * 0.5, sz * 0.2, sz * 0.5);
    ctx.fillStyle = '#d9533c'; ctx.beginPath(); ctx.ellipse(x, y - sz * 0.5, sz * 0.38, sz * 0.28, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; circle(x - sz * 0.14, y - sz * 0.6, sz * 0.06); circle(x + sz * 0.12, y - sz * 0.56, sz * 0.05);
  }
}
const fade = dz => Math.max(0, Math.min(1, (FAR - dz) / 6)); // 遠くからふわっと出てくる

function drawGround(P) {
  ctx.fillStyle = P.ground; ctx.fillRect(0, HOR, W, H - HOR);
  // しま模様（前に進んでいる感じ）
  const z0 = state.camZ + 0.6, z1 = state.camZ + FAR;
  for (let k = Math.floor(z1 / STRIPE); k * STRIPE > z0 - STRIPE; k--) {
    const za = Math.max(k * STRIPE, z0), zb = Math.min((k + 1) * STRIPE, z1);
    if (zb <= za) continue;
    const a = proj(0, zb), b = proj(0, za);
    if (k % 2) { ctx.fillStyle = P.ground2; ctx.fillRect(0, a.y, W, b.y - a.y + 1); }
    const quad = (hw, col) => {
      const ca = roadCenter(zb), cb = roadCenter(za);
      const l1 = proj(ca - hw, zb), r1 = proj(ca + hw, zb), l2 = proj(cb - hw, za), r2 = proj(cb + hw, za);
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(l1.x, l1.y); ctx.lineTo(r1.x, r1.y); ctx.lineTo(r2.x, r2.y + 1); ctx.lineTo(l2.x, l2.y + 1); ctx.closePath(); ctx.fill();
    };
    quad(ROAD_HW + 0.12, P.edge);
    quad(ROAD_HW, k % 2 ? P.path2 : P.path);
  }
}

function draw() {
  const P = curPal = mixPalette(PALETTES[state.prevScene], PALETTES[state.scene], state.sceneMix);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, HOR);
  g.addColorStop(0, P.sky1); g.addColorStop(1, P.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR + 2);
  // たいよう・くも
  ctx.fillStyle = 'rgba(255,240,170,.9)'; circle(W * 0.72 - CAMX * 30, HOR * 0.4, M * 0.07);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let c = 0; c < 4; c++) {
    const span = W + M * 0.8, x = ((c * span / 4 - CAMX * 40 - state.time * 5) % span + span) % span - M * 0.4, y = HOR * (0.2 + 0.18 * (c % 3)), s = M * (0.05 + 0.02 * (c % 2));
    circle(x, y, s); circle(x + s, y + s * 0.2, s * 0.8); circle(x - s, y + s * 0.25, s * 0.7);
  }
  drawHills(HOR, M * 0.13, 2.1, P.hill1, 1);
  drawHills(HOR, M * 0.06, 3.3, P.hill2, 4);
  drawGround(P);

  // 奥から順にならべて描く
  const items = [];
  for (const t of state.trees) { const p = proj(t.x, t.z); if (p.dz > 0.9 && p.dz < FAR) items.push({ dz: p.dz, f: () => { ctx.globalAlpha = fade(p.dz); drawTree(p.x, p.y, t.h * p.s, t, P); ctx.globalAlpha = 1; } }); }
  for (const w of state.webs) { const p = proj(w.x, w.z); w.sr = 0; if (p.dz > 1.1 && p.dz < FAR) items.push({ dz: p.dz, f: () => { ctx.globalAlpha = fade(p.dz); drawWeb(w, p); ctx.globalAlpha = 1; } }); }
  for (const d of state.decos) { const p = proj(d.x, d.z); if (p.dz > 0.9 && p.dz < FAR && p.x > -50 && p.x < W + 50) items.push({ dz: p.dz, f: () => { ctx.globalAlpha = fade(p.dz); drawDeco(d, p, P); ctx.globalAlpha = 1; } }); }
  for (const n of state.nuts) {
    const p = proj(n.x, n.z);
    n.ph = 0;
    if (p.dz < NEAR - 0.1 || p.dz > NUT_FAR) continue;
    const h = NUT_H * n.sp.size * p.s;
    n.sx = p.x; n.sy = p.y; n.ph = p.x > -h && p.x < W + h ? h : 0;
    items.push({ dz: p.dz, f: () => {
      const hop = Math.pow(Math.max(0, Math.sin(state.time * 2.4 + n.phase)), 12) * h * 0.25;
      ctx.globalAlpha = Math.max(0, Math.min(1, (NUT_FAR - p.dz) / 5));
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, h * 0.3, h * 0.07, 0, 0, Math.PI * 2); ctx.fill();
      drawNut(n.sp, p.x, p.y - hop, h, Math.sin(state.time * 3 + n.phase) * 0.1);
      ctx.globalAlpha = 1;
    } });
  }
  const r = state.reward;
  let rewardDraw = null;
  if (r) {
    // 道のむこうから走ってくる → ぴょんぴょん → となりへ
    if (r.t < 3.6) {
      const dzA = r.t < 1.4 ? 14 - 11 * (r.t / 1.4) : 3;
      const p = proj(roadCenter(state.camZ + dzA), state.camZ + dzA);
      const hop = r.t < 1.4 ? Math.abs(Math.sin(r.t * 12)) * p.s * 0.08 : Math.abs(Math.sin((r.t - 1.4) * 5)) * p.s * 0.3;
      items.push({ dz: dzA - 0.01, f: () => emoji(ANIMALS[r.ai].e, p.x, p.y - p.s * 0.3 - hop, p.s * 0.6) });
    } else {
      const p = proj(roadCenter(state.camZ + 3), state.camZ + 3), slot = { x: safe.l + W * 0.1, y: H - safe.b - D * 0.12, size: D * 1.15 };
      const f = Math.min(1, (r.t - 3.6) / 1.2), e = f * f * (3 - 2 * f);
      const size = p.s * 0.6 + (slot.size - p.s * 0.6) * e;
      const x = p.x + (slot.x - p.x) * e, y = (p.y - p.s * 0.3) + (slot.y - size * 0.5 - (p.y - p.s * 0.3)) * e;
      rewardDraw = () => emoji(ANIMALS[r.ai].e, x, y - Math.abs(Math.sin(r.t * 10)) * D * 0.1, size);
    }
  }
  items.sort((a, b) => b.dz - a.dz).forEach(it => it.f());

  // となりを歩くなかま
  for (const f of friendSlots()) {
    const j = Math.sin((state.friendJump[f.i] || 0) * Math.PI) * D * 0.5;
    const b = Math.abs(Math.sin(state.walkPhase + f.i * 1.3)) * D * 0.08 * Math.min(1, state.speed / 0.5);
    emoji(ANIMALS[f.ai].e, f.x, f.y - f.size * 0.5 - b - j, f.size, f.side < 0);
  }
  if (rewardDraw) rewardDraw();

  // とんでいくどんぐり
  for (const f of state.flying) {
    const t = Math.min(1, f.t), e = 1 - Math.pow(1 - t, 2);
    const tg = f.kind === 'spider' ? L.spiderTarget : L.basketTarget;
    const x = f.x0 + (tg.x - f.x0) * e;
    const y = f.y0 + (tg.y - f.y0) * e - Math.sin(Math.PI * t) * H * 0.15;
    const h = t < 0.2 ? f.h0 * (1 + t / 0.2 * 0.5) : f.h0 * 1.5 + (D * 0.4 - f.h0 * 1.5) * (t - 0.2) / 0.8;
    if (f.kind === 'spider') drawSpider(f.sp, x, y, h * 0.9, Math.sin(t * 20) * 0.3);
    else drawNut(f.sp, x, y + h * 0.45, h, t * 6);
  }
  // つぶつぶ
  for (const p of state.parts) {
    const a = Math.max(0, 1 - Math.max(0, (p.life - p.max * 0.6) / (p.max * 0.4)));
    ctx.save(); ctx.globalAlpha = a;
    if (p.sp) { drawNut(p.sp, p.x, p.y, D * 0.45, p.rot); ctx.restore(); continue; }
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.type === 'spark') {
      ctx.fillStyle = p.color; ctx.beginPath();
      for (let k = 0; k < 8; k++) { const rr = k % 2 ? p.size * 0.35 : p.size; ctx.lineTo(Math.cos(k * Math.PI / 4) * rr, Math.sin(k * Math.PI / 4) * rr); }
      ctx.closePath(); ctx.fill();
    } else if (p.type === 'leaf') {
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    } else { ctx.fillStyle = p.color; ctx.fillRect(-p.size * 0.4, -p.size * 0.25, p.size * 0.8, p.size * 0.5); }
    ctx.restore();
  }

  drawUI();
}

function drawUI() {
  const z = L.zukan;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; circle(z.x, z.y + 4, z.r);
  ctx.fillStyle = '#fff'; circle(z.x, z.y, z.r);
  emoji('📖', z.x, z.y + 2, z.r * 1.1, false);

  const b = L.basket, bb = Math.sin(state.basketBounce * Math.PI) * 0.15;
  ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(1 + bb, 1 + bb);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; rrect(-b.w / 2, -b.h / 2 + 4, b.w, b.h, b.h / 2); ctx.fill();
  ctx.fillStyle = '#fff'; rrect(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2); ctx.fill();
  emoji('🧺', -b.w / 2 + b.h * 0.55, 2, b.h * 0.62, false);
  ctx.font = `bold ${b.h * 0.52}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#6b3a17';
  ctx.fillText(String(save.total), b.h * 0.45, 3);
  ctx.restore();

  if (save.spiderTotal > 0) {
    const sb = L.spiderBox, k = Math.sin(state.spiderBounce * Math.PI) * 0.15;
    ctx.save(); ctx.translate(sb.x + sb.w / 2, sb.y + sb.h / 2); ctx.scale(1 + k, 1 + k);
    ctx.fillStyle = 'rgba(0,0,0,.15)'; rrect(-sb.w / 2, -sb.h / 2 + 4, sb.w, sb.h, sb.h / 2); ctx.fill();
    ctx.fillStyle = '#fff'; rrect(-sb.w / 2, -sb.h / 2, sb.w, sb.h, sb.h / 2); ctx.fill();
    drawSpider(SPIDERS[0], -sb.w / 2 + sb.h * 0.55, 2, sb.h * 0.8);
    ctx.font = `bold ${sb.h * 0.52}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#6b3a17';
    ctx.fillText(String(save.spiderTotal), sb.h * 0.4, 3);
    ctx.restore();
  }
  const bn = state.banner;
  if (bn && !state.reward) {
    const t = bn.t, sc = t < 0.25 ? 0.5 + 0.5 * Math.sin(t / 0.25 * Math.PI / 2) * 1.1 : 1, al = t > 2 ? 1 - (t - 2) / 0.4 : 1;
    const fs = Math.max(34, Math.min(M * 0.1, 80));
    ctx.font = `bold ${fs}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
    const tw = ctx.measureText(bn.sp.kana).width, iw = fs * 1.1, w = tw + iw + fs * 1.0, h = fs * 1.7;
    ctx.save(); ctx.globalAlpha = Math.max(0, al);
    ctx.translate(W / 2, Math.max(H * 0.24, safe.t + L.btn + L.pad * 2 + h / 2)); ctx.scale(sc, sc);
    ctx.fillStyle = bn.sp.rare ? '#fff3b0' : '#fff'; rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = bn.sp.rare ? '#f0a830' : '#e9cf9c'; ctx.lineWidth = 5; ctx.stroke();
    if (SPIDERS.includes(bn.sp)) drawSpider(bn.sp, -w / 2 + fs * 0.5 + iw / 2, 0, h * 0.75);
    else drawNut(bn.sp, -w / 2 + fs * 0.5 + iw / 2, h * 0.36, h * 0.8 * bn.sp.size, 0);
    ctx.fillStyle = '#6b3a17'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(bn.sp.kana, -w / 2 + fs * 0.6 + iw, 2);
    ctx.restore();
  }

  const r = state.reward;
  if (r && r.t < 4.2) {
    const sc = r.t < 0.4 ? r.t / 0.4 : 1 + Math.sin(r.t * 4) * 0.04, al = r.t > 3.7 ? 1 - (r.t - 3.7) / 0.5 : 1;
    const fs = Math.max(48, Math.min(M * 0.16, 140));
    ctx.save(); ctx.globalAlpha = Math.max(0, al); ctx.translate(W / 2, H * 0.26); ctx.scale(sc, sc);
    ctx.font = `bold ${fs}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = fs * 0.16; ctx.strokeStyle = '#fff'; ctx.strokeText('やったー！', 0, 0);
    ctx.fillStyle = '#e8604c'; ctx.fillText('やったー！', 0, 0);
    ctx.restore();
  }

  const gr = L.gear;
  ctx.globalAlpha = 0.35; emoji('⚙️', gr.x, gr.y, 26, false); ctx.globalAlpha = 1;
  if (state.gearHold) {
    const f = Math.min(1, (performance.now() - state.gearHold.t0) / 1500);
    ctx.strokeStyle = '#f0a830'; ctx.lineWidth = 5; ctx.beginPath();
    ctx.arc(gr.x, gr.y, gr.r + 6, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
}

/* ---------- ループ ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!document.hidden) { update(dt); draw(); }
  requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const gr = L.gear;
  if (Math.hypot(e.clientX - gr.x, e.clientY - gr.y) < gr.r + 14) {
    const id = e.pointerId;
    state.gearHold = { id, t0: performance.now(), timer: setTimeout(() => { state.gearHold = null; openSettings(); }, 1500) };
    return;
  }
  onTap(e.clientX, e.clientY);
});
const endHold = e => { if (state.gearHold && state.gearHold.id === e.pointerId) { clearTimeout(state.gearHold.timer); state.gearHold = null; } };
cv.addEventListener('pointerup', endHold);
cv.addEventListener('pointercancel', endHold);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

$('#start').addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  $('#start').classList.add('hidden');
  state.started = true;
  // 最初はすぐ近くにも少し置いておく
  addNut(CAMX + rnd(-0.5, 0.5) * L.xRange, state.camZ + 3.2, pickSpecies());
  addNut(CAMX + rnd(-1, 1) * L.xRange, state.camZ + 5, pickSpecies());
  SFX.sparkle();
  speak('おさんぽ いこう！', 0.9);
});

/* ---------- ずかん ---------- */
function openZukan() {
  state.paused = true;
  const fill = (grid, list, counts, unit) => { grid.innerHTML = ''; for (const sp of list) {
    const n = counts[sp.id] || 0, c = document.createElement('button');
    c.className = 'card' + (n ? '' : ' no');
    c.innerHTML = `<img src="${sp.url}" alt=""><div class="nm${n && sp.kana.length > 6 ? ' long' : ''}">${n ? sp.kana : '？'}</div><div class="ct">${n ? n + unit : ''}</div>`;
    c.addEventListener('click', () => {
      audioInit(); c.classList.remove('wig'); void c.offsetWidth; c.classList.add('wig');
      if (n) { SFX.pick(); speak(sp.name); } else { SFX.boing(); speak('まだ みつけてないよ'); }
    });
    grid.appendChild(c);
  } };
  fill($('#zgrid'), SPECIES, save.counts, 'こ');
  fill($('#zgrid2'), SPIDERS, save.spiders, 'ひき');
  const fr = $('#zfriends');
  fr.innerHTML = save.friends.length ? `<span class="lb">なかま</span>${save.friends.map(i => ANIMALS[i].e).join(' ')}` : '';
  $('#zukan').classList.remove('hidden');
  SFX.plop();
}
$('#zclose').addEventListener('click', () => { $('#zukan').classList.add('hidden'); state.paused = false; SFX.plop(); });

/* ---------- せってい ---------- */
function syncSettingsUI() {
  document.querySelectorAll('.seg').forEach(seg => {
    const k = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(settings[k]) === b.dataset.v));
  });
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v, k = seg.dataset.key;
  settings[k] = v === 'true' ? true : v === 'false' ? false : parseFloat(v);
  store.set(SET_KEY, settings); syncSettingsUI();
}));
